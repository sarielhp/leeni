<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}" data-color-mode="dark" data-dark-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#13141c">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body class="dark-theme">
    <header class="site-header">
      <div class="container-lg px-3 py-3 site-header-inner">
        <a class="site-title" href="{{ "/" | relative_url }}">
          <span class="site-logo">⚡</span> Leeni
        </a>
        <nav class="site-nav">
          <a class="nav-link" href="{{ "/" | relative_url }}">Overview</a>
          <a class="nav-link" href="{{ "/gallery.html" | relative_url }}">Gallery</a>
          <a class="nav-link" href="{{ "/diagnostics.html" | relative_url }}">Diagnostics</a>
          <a class="nav-link" href="{{ "/troubleshooting_bibliography_errors.html" | relative_url }}">Troubleshooting</a>
          <a class="nav-link" href="{{ "/guides/underfull_boxes/" | relative_url }}">Underfull Boxes</a>
          <a class="nav-link github-badge" href="https://github.com/sarielhp/leeni" target="_blank" rel="noopener noreferrer">
            <svg class="octicon" height="16" viewBox="0 0 16 16" width="16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
            <span>GitHub</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="container-lg px-3 my-4 markdown-body">
        {{ content }}

        <footer class="site-footer">
          <div class="footer-content">
            <span><strong>leeni</strong> — Fast, isolated, intelligent LaTeX compilation manager.</span>
            <span class="footer-links">
              <a href="https://github.com/sarielhp/leeni" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
              &bull;
              <a href="{{ "/gallery.html" | relative_url }}">Diagnostic Gallery</a>
            </span>
          </div>
        </footer>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>
      anchors.options = { placement: 'right', class: 'anchor-link' };
      anchors.add('.markdown-body h2, .markdown-body h3, .markdown-body h4');
    </script>
  </body>
</html>
