<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 580" width="1140" height="580">
  <defs>
    <style>
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; line-height: 21px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .badge { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1140" height="580" rx="14" fill="#13141c"/>

  <!-- Left Panel: latexmk -->
  <g transform="translate(24, 24)" filter="url(#shadow)">
    <rect width="528" height="530" rx="10" fill="#1a1b26" stroke="#2f334d" stroke-width="1.5"/>
    <path d="M 0,10 A 10,10 0 0,1 10,0 L 518,0 A 10,10 0 0,1 528,10 L 528,40 L 0,40 Z" fill="#16161e"/>
    <circle cx="20" cy="20" r="6" fill="#ff6b6b"/>
    <circle cx="38" cy="20" r="6" fill="#e0af68"/>
    <circle cx="56" cy="20" r="6" fill="#414868"/>
    <text x="264" y="25" fill="#787c99" text-anchor="middle" class="title">latexmk (Standard TeX Log)</text>

    <g transform="translate(20, 66)" class="code">
      <text x="0" y="0" fill="#7dcfff" font-weight="bold">$ latexmk -xelatex paper.tex</text>
        <text x="0" y="21" fill="#565f89" >Latexmk: This is Latexmk, version 4.88.</text>
        <text x="0" y="42" fill="#565f89" >Latexmk: applying rule 'xelatex'...</text>
        <text x="0" y="63" fill="#565f89" >Running 'xelatex -no-pdf -recorder paper.tex'</text>
        <text x="0" y="84" fill="#565f89" >This is XeTeX, Version 3.141592653 (TeX Live)...</text>
        <text x="0" y="105" fill="#565f89" >(./paper.tex LaTeX2e &lt;2026-06-01&gt;</text>
        <text x="0" y="126" fill="#565f89" >(/usr/share/texlive/.../article.cls)</text>
        <text x="0" y="147" fill="#565f89" >(/usr/share/texlive/.../l3backend-xetex.def)</text>
        <text x="0" y="168" fill="#565f89" >(junk/paper.aux))</text>
        <text x="0" y="189" fill="#ff9e64" font-weight="bold">Runaway argument?</text>
        <text x="0" y="210" fill="#c0caf5" >{that forgot the closing brace. \par And here... \ETC.</text>
        <text x="0" y="231" fill="#ff6b6b" font-weight="bold">! File ended while scanning use of \textbf .</text>
        <text x="0" y="252" fill="#565f89" >&lt;inserted text&gt;</text>
        <text x="0" y="273" fill="#565f89" >                \par</text>
        <text x="0" y="294" fill="#ff6b6b" >&lt;*&gt; .../paper.tex</text>
        <text x="0" y="315" fill="#ff6b6b" font-weight="bold">! Emergency stop.</text>
        <text x="0" y="336" fill="#565f89" >Transcript written on junk/paper.log.</text>
        <text x="0" y="357" fill="#ff9e64" >Latexmk: Errors, so I did not complete making targets</text>
        <text x="0" y="378" fill="#ff6b6b" >Collected error summary: 'xelatex' return code 1</text>
    </g>

    <g transform="translate(20, 478)">
            <rect width="488" height="34" rx="6" fill="#2d1c24" stroke="#ff6b6b" stroke-width="1.2"/>
            <text x="244" y="21" fill="#ff6b6b" text-anchor="middle" class="badge">❌ 50+ lines of noise — line of unclosed brace is unknown!</text>
          </g>
  </g>

  <!-- Right Panel: leeni -->
  <g transform="translate(588, 24)" filter="url(#shadow)">
    <rect width="528" height="530" rx="10" fill="#1a1b26" stroke="#384a68" stroke-width="1.5"/>
    <path d="M 0,10 A 10,10 0 0,1 10,0 L 518,0 A 10,10 0 0,1 528,10 L 528,40 L 0,40 Z" fill="#16161e"/>
    <circle cx="20" cy="20" r="6" fill="#ff6b6b"/>
    <circle cx="38" cy="20" r="6" fill="#e0af68"/>
    <circle cx="56" cy="20" r="6" fill="#9ece6a"/>
    <text x="264" y="25" fill="#c0caf5" text-anchor="middle" class="title">leeni (l)</text>

    <g transform="translate(20, 66)" class="code">
      <text x="0" y="0" fill="#7dcfff" font-weight="bold">$ l paper.tex</text>
        <text x="0" y="21" fill="#ff6b6b" font-weight="bold">      xelatex (1): Latex compilation failed! (Status: 1)</text>
        <text x="0" y="42" fill="#c0caf5" ></text>
        <text x="0" y="63" fill="#ff6b6b" font-weight="bold">── paper.tex (2 errors) ──────────────────────────────────</text>
        <text x="0" y="84" fill="#ff6b6b" font-weight="bold">6: ! Unclosed open brace '{' (opened on line 6, col 34)</text>
        <text x="0" y="105" fill="#ff6b6b" >   inside environment 'document' (ended at line 9)</text>
        <text x="0" y="126" fill="#c0caf5" font-weight="bold">   l.6 Here is an unclosed macro \textbf{that forgot...</text>
        <text x="0" y="147" fill="#ff9e64" font-weight="bold"> : Runaway argument?</text>
        <text x="0" y="168" fill="#c0caf5" >   {that forgot the closing brace. \par And here...</text>
        <text x="0" y="189" fill="#9ece6a" font-weight="bold">   ▸ Hint: Unclosed brace across paragraph; insert '}'</text>
        <text x="0" y="210" fill="#565f89" >See junk/err_xelatex_1 for full error details.</text>
        <text x="0" y="231" fill="#c0caf5" ></text>
        <text x="0" y="252" fill="#7aa2f7" >Errors: 2, Alerts: 0, Warnings: 0, Whatevers: 0</text>
    </g>

    <g transform="translate(20, 478)">
            <rect width="488" height="34" rx="6" fill="#1c2d24" stroke="#9ece6a" stroke-width="1.2"/>
            <text x="244" y="21" fill="#9ece6a" text-anchor="middle" class="badge">✔ Pinpoints opened line 6, col 34 instantly with actionable hint!</text>
          </g>
  </g>
</svg>
