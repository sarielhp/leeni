<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 614" width="1240" height="614">
  <defs>
    <style>
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; line-height: 20px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; }
      .badge { font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1240" height="614" rx="14" fill="#13141c"/>
  <g transform="translate(24, 20)" filter="url(#shadow)">
  <rect width="576" height="574" rx="10" fill="#1a1b26" stroke="#2f334d" stroke-width="1.5"/>
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 566,0 A 10,10 0 0,1 576,10 L 576,40 L 0,40 Z" fill="#16161e"/>
  <circle cx="20" cy="20" r="6" fill="#ff6b6b"/>
  <circle cx="38" cy="20" r="6" fill="#e0af68"/>
  <circle cx="56" cy="20" r="6" fill="#414868"/>
  <text x="288" y="25" fill="#787c99" text-anchor="middle" class="title">Standard Tool: latexmk</text>
  <g transform="translate(18, 62)" class="code">
    <text x="0" y="0"><tspan fill="#7dcfff" font-weight="bold">$ latexmk -xelatex paper.tex</tspan></text>
        <text x="0" y="20"><tspan fill="#e0af68" font-weight="bold" font-size="15.5px">&lt;&lt;&lt; DELETED 18 LINES &gt;&gt;&gt;</tspan></text>
        <text x="0" y="40"><tspan fill="#c0caf5">L3 programming layer &lt;2026-06-18&gt;</tspan></text>
        <text x="0" y="60"><tspan fill="#c0caf5">(/usr/share/texlive/texmf-dist/tex/latex/base/article.cls</tspan></text>
        <text x="0" y="80"><tspan fill="#c0caf5">Document Class: article 2025/01/22 v1.4n Standard LaTeX document</tspan></text>
        <text x="0" y="100"><tspan fill="#c0caf5">    </tspan><tspan fill="#c0caf5">class</tspan></text>
        <text x="0" y="120"><tspan fill="#c0caf5">(/usr/share/texlive/texmf-dist/tex/latex/base/size10.clo))</tspan></text>
        <text x="0" y="140"><tspan fill="#c0caf5">(/usr/share/texlive/texmf-dist/tex/latex/l3backend/l3backend-xetex.def)</tspan></text>
        <text x="0" y="160"><tspan fill="#c0caf5">(junk/paper.aux)</tspan></text>
        <text x="0" y="180"><tspan fill="#ff6b6b" font-weight="bold">! Undefined control sequence.</tspan></text>
        <text x="0" y="200"><tspan fill="#c0caf5">l.3 \includegrahics</tspan></text>
        <text x="0" y="220"><tspan fill="#c0caf5">                   {my_figure.png}</tspan></text>
        <text x="0" y="240"><tspan fill="#c0caf5">No pages of output.</tspan></text>
        <text x="0" y="260"><tspan fill="#c0caf5">Transcript written on junk/paper.log.</tspan></text>
        <text x="0" y="280"><tspan fill="#565f89">Latexmk: Getting log file 'junk/paper.log'</tspan></text>
        <text x="0" y="300"><tspan fill="#565f89">Latexmk: Examining 'junk/paper.fls'</tspan></text>
        <text x="0" y="320"><tspan fill="#565f89">Latexmk: Examining 'junk/paper.log'</tspan></text>
        <text x="0" y="340"><tspan fill="#565f89">Latexmk: Log file says no output from latex</tspan></text>
        <text x="0" y="360"><tspan fill="#565f89">Latexmk: For rule 'xelatex', no output was made</tspan></text>
        <text x="0" y="380"><tspan fill="#565f89">Latexmk: Errors, so I did not complete making targets</tspan></text>
        <text x="0" y="400"><tspan fill="#ff6b6b" font-weight="bold">Collected error summary (may duplicate other messages):</tspan></text>
        <text x="0" y="420"><tspan fill="#c0caf5">  xelatex: Command for 'xelatex' gave return code 1</tspan></text>
        <text x="0" y="440"><tspan fill="#c0caf5">      Refer to 'junk/paper.log' and/or above output for details</tspan></text>
  </g>
  <g transform="translate(18, 532)">
    <rect width="540" height="32" rx="6" fill="#2d1c24" stroke="#ff6b6b" stroke-width="1.2"/>
    <text x="270" y="20" fill="#ff6b6b" text-anchor="middle" class="badge">❌ Cascades into 4 math-mode errors and runaway tokens!</text>
  </g>
</g>

  <g transform="translate(640, 20)" filter="url(#shadow)">
  <rect width="576" height="574" rx="10" fill="#1a1b26" stroke="#384a68" stroke-width="1.5"/>
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 566,0 A 10,10 0 0,1 576,10 L 576,40 L 0,40 Z" fill="#16161e"/>
  <circle cx="20" cy="20" r="6" fill="#ff6b6b"/>
  <circle cx="38" cy="20" r="6" fill="#e0af68"/>
  <circle cx="56" cy="20" r="6" fill="#9ece6a"/>
  <text x="288" y="25" fill="#c0caf5" text-anchor="middle" class="title">leeni (l)</text>
  <g transform="translate(18, 62)" class="code">
    <text x="0" y="0"><tspan fill="#c0caf5">$ l paper.tex</tspan></text>
        <text x="0" y="20"><tspan fill="#c0caf5">      </tspan><tspan fill="#c0caf5" font-weight="bold">xelatex</tspan><tspan fill="#c0caf5"> (1): </tspan><tspan fill="#ff6b6b" font-weight="bold">Latex compilation failed!</tspan><tspan fill="#c0caf5"> (Status: 1)</tspan></text>
        <text x="0" y="40"><tspan fill="#c0caf5"></tspan></text>
        <text x="0" y="60"><tspan fill="#ff6b6b" font-weight="bold">── </tspan><tspan fill="#c0caf5" font-weight="bold">paper.tex</tspan><tspan fill="#c0caf5"> (4 errors) </tspan><tspan fill="#ff6b6b" font-weight="bold">────────────────────────────────────────────────────────</tspan></text>
        <text x="0" y="80"><tspan fill="#ff6b6b" font-weight="bold">paper.tex</tspan><tspan fill="#ff6b6b" font-weight="bold">:</tspan><tspan fill="#7dcfff" font-weight="bold">3</tspan><tspan fill="#ff6b6b" font-weight="bold">:</tspan><tspan fill="#ff6b6b" font-weight="bold">1: Undefined control sequence.</tspan></text>
        <text x="0" y="100"><tspan fill="#c0caf5">  </tspan><tspan fill="#7dcfff">  3</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#c0caf5"> \includegrahics{my_figure.png}</tspan></text>
        <text x="0" y="120"><tspan fill="#c0caf5">      </tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#ff6b6b" font-weight="bold">^^^^^^^^^^^^^^^</tspan><tspan fill="#7dcfff"> Did you mean '\includegraphics'? (requires</tspan></text>
        <text x="0" y="140"><tspan fill="#7dcfff">    </tspan><tspan fill="#7dcfff">\usepackage{graphicx})</tspan></text>
        <text x="0" y="160"><tspan fill="#ff6b6b" font-weight="bold">paper.tex</tspan><tspan fill="#ff6b6b" font-weight="bold">:</tspan><tspan fill="#7dcfff" font-weight="bold">3</tspan><tspan fill="#ff6b6b" font-weight="bold">:</tspan><tspan fill="#ff6b6b" font-weight="bold"> Missing $ inserted.</tspan></text>
        <text x="0" y="180"><tspan fill="#c0caf5">  </tspan><tspan fill="#7dcfff">  3</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#c0caf5"> \includegrahics{my_figure.png}</tspan></text>
        <text x="0" y="200"><tspan fill="#c0caf5">       </tspan><tspan fill="#7dcfff" font-weight="bold">▸</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#7dcfff">Hint: Subscript '_' outside math mode; wrap in $...$ or</tspan></text>
        <text x="0" y="220"><tspan fill="#7dcfff">    </tspan><tspan fill="#7dcfff">escape as '\_'</tspan></text>
        <text x="0" y="240"><tspan fill="#ff6b6b" font-weight="bold">paper.tex</tspan><tspan fill="#ff6b6b" font-weight="bold">:</tspan><tspan fill="#7dcfff" font-weight="bold">3</tspan><tspan fill="#ff6b6b" font-weight="bold">:</tspan><tspan fill="#ff6b6b" font-weight="bold"> Extra }, or forgotten $.</tspan></text>
        <text x="0" y="260"><tspan fill="#c0caf5">  </tspan><tspan fill="#7dcfff">  3</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#c0caf5"> \includegrahics{my_figure.png}</tspan></text>
        <text x="0" y="280"><tspan fill="#c0caf5">       </tspan><tspan fill="#7dcfff" font-weight="bold">▸</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#7dcfff">Hint: Unmatched closing brace '}'; remove extra '}' or</tspan></text>
        <text x="0" y="300"><tspan fill="#7dcfff">    </tspan><tspan fill="#7dcfff">check balance</tspan></text>
        <text x="0" y="320"><tspan fill="#ff6b6b" font-weight="bold">paper.tex</tspan><tspan fill="#ff6b6b" font-weight="bold">:</tspan><tspan fill="#7dcfff" font-weight="bold">4</tspan><tspan fill="#ff6b6b" font-weight="bold">:</tspan><tspan fill="#ff6b6b" font-weight="bold"> Missing $ inserted.</tspan></text>
        <text x="0" y="340"><tspan fill="#c0caf5">  </tspan><tspan fill="#7dcfff">  4</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#c0caf5"> \end{document}</tspan></text>
        <text x="0" y="360"><tspan fill="#c0caf5">       </tspan><tspan fill="#7dcfff" font-weight="bold">▸</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#7dcfff">Hint: Subscript '_' outside math mode; wrap in $...$ or</tspan></text>
        <text x="0" y="380"><tspan fill="#7dcfff">    </tspan><tspan fill="#7dcfff">escape as '\_'</tspan></text>
        <text x="0" y="400"><tspan fill="#c0caf5"></tspan></text>
        <text x="0" y="420"><tspan fill="#ff6b6b" font-weight="bold">Errors: 4</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#9ece6a" font-weight="bold">Alerts: 0</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#9ece6a" font-weight="bold">Warnings: 0</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#9ece6a" font-weight="bold">Whatevers: 0</tspan></text>
        <text x="0" y="440"><tspan fill="#c0caf5"></tspan></text>
  </g>
  <g transform="translate(18, 532)">
    <rect width="540" height="32" rx="6" fill="#1c2d24" stroke="#9ece6a" stroke-width="1.2"/>
    <text x="270" y="20" fill="#9ece6a" text-anchor="middle" class="badge">✔ Levenshtein fuzzy match suggests \includegraphics + graphicx!</text>
  </g>
</g>

</svg>
